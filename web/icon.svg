<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DLDI: a weary face (😩) dressed up in Deadlock's art-deco brass -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset=".55" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8f5e19"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset="1" stop-color="#c98f2f"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#1d3a38"/>
      <stop offset="1" stop-color="#0b1112"/>
    </radialGradient>
  </defs>
  <!-- deco medallion: dark patina disc, double brass ring -->
  <circle cx="32" cy="32" r="30.5" fill="url(#bg)" stroke="url(#brass)" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="26.6" fill="none" stroke="#d9a441" stroke-width=".9" opacity=".75"/>
  <!-- sunburst rays between the rings and the face -->
  <g stroke="#d9a441" stroke-width="1.3" stroke-linecap="round" opacity=".85">
    <path d="M32 6.5v4M32 53.5v4M6.5 32h4M53.5 32h4"/>
    <path d="M13.9 13.9l2.8 2.8M47.3 47.3l2.8 2.8M50.1 13.9l-2.8 2.8M16.7 47.3l-2.8 2.8"/>
  </g>
  <!-- top diamond ornament -->
  <path d="M32 1.5l3.2 3.6L32 8.7l-3.2-3.6z" fill="url(#brass)" stroke="#0b1112" stroke-width=".8"/>
  <!-- the weary face -->
  <circle cx="32" cy="33" r="18.5" fill="url(#face)" stroke="#6b4310" stroke-width="1.4"/>
  <!-- brows: sad, slanted up toward the middle -->
  <g fill="none" stroke="#3a2406" stroke-width="2.3" stroke-linecap="round">
    <path d="M20.5 25.2l7.3-3.4"/>
    <path d="M43.5 25.2l-7.3-3.4"/>
    <!-- eyes squeezed shut: > < -->
    <path d="M22.6 28.4l5.2 2.6-5.2 2.6"/>
    <path d="M41.4 28.4l-5.2 2.6 5.2 2.6"/>
  </g>
  <!-- open wailing mouth -->
  <path d="M24.2 45.2c0-5.6 3.6-8.6 7.8-8.6s7.8 3 7.8 8.6c0 1.1-.8 1.6-1.8 1.2-1.8-.7-3.8-1-6-1s-4.2.3-6 1c-1 .4-1.8-.1-1.8-1.2z" fill="#3a2406"/>
  <path d="M27.2 39.6c1.3-1 2.9-1.4 4.8-1.4s3.5.4 4.8 1.4" fill="none" stroke="#f3e2b4" stroke-width="1.6" stroke-linecap="round"/>
</svg>
