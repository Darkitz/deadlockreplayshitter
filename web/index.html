<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the site is dark already: tell the browser and dark-mode extensions not to invert it -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<meta name="theme-color" content="#0a0b0d">
<meta name="description" content="Drop a Deadlock demo and see every skillshot, gun and melee hit on a scrubbable timeline. Replay analysis runs entirely in your browser.">
<link rel="canonical" href="https://darkitz.github.io/deadlockreplayshitter/">
<meta property="og:type" content="website">
<meta property="og:title" content="DLDI · Deadlock Demo Insight">
<meta property="og:description" content="Drop a Deadlock demo: skillshots, gun and melee hits, chat and movement on a scrubbable timeline. Analysis runs offline in your browser.">
<meta property="og:url" content="https://darkitz.github.io/deadlockreplayshitter/">
<meta property="og:image" content="https://darkitz.github.io/deadlockreplayshitter/icon.png">
<title>DLDI · Deadlock Demo Insight</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<script>
  // apply the saved theme before the first paint (no dark flash for light-mode users)
  try { if (localStorage.getItem("skillhitter.theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <img class="logo" src="icon.svg" alt="" width="44" height="44">
    <div>
      <h1>DLDI</h1>
      <p id="subtitle" class="muted">Deadlock Demo Insight · in your browser</p>
    </div>
  </a>
  <nav class="top-nav">
    <a href="#/about" data-nav="about" title="how the numbers are made">How it works</a>
  </nav>
  <div class="top-right">
    <button class="btn lang-toggle" id="lang-toggle" title="language">EN</button>
    <button class="btn theme-toggle" id="theme-toggle" title="switch light / dark" aria-label="switch light / dark">☀</button>
    <button class="btn primary" data-open-demo title="parse a .dem / .dem.bz2 in your browser (or drag it onto the page)">open demo</button>
  </div>
</header>

<main id="app"></main>

<footer class="muted small">
  DLDI · Deadlock Demo Insight · demos are parsed in your browser (haste compiled to WebAssembly) and never leave it ·
  game data from Deadlock's files · not affiliated with Valve
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
