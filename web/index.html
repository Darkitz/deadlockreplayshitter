<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Hitter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23e0b25a' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%236fd08c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <img id="avatar" class="avatar" alt="" hidden>
    <div>
      <h1><span id="player-name">Skill Hitter</span></h1>
      <p id="subtitle" class="muted">loading…</p>
    </div>
  </a>
  <div class="top-right">
    <span id="rank" class="rank"></span>
    <a id="steam-link" class="muted small" target="_blank" rel="noopener"></a>
    <button id="sync" class="btn" hidden>sync</button>
  </div>
  <pre id="sync-log" class="sync-log" hidden></pre>
</header>

<main id="app"></main>

<footer class="muted small">
  <div id="health"></div>
  Skill Hitter · demos parsed locally with haste · match history, profiles and assets from deadlock-api.com
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
