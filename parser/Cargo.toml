[workspace]
members = [
    "dlparse",
    "vendor/haste",
    "vendor/haste/crates/*",
    "vendor/valveprotos",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
valveprotos = { path = "vendor/valveprotos" }
haste = { path = "vendor/haste" }
haste_broadcast = { path = "vendor/haste/crates/haste_broadcast" }
haste_core = { path = "vendor/haste/crates/haste_core" }
haste_vartype = { path = "vendor/haste/crates/haste_vartype" }
dungers = { path = "vendor/haste/crates/dungers" }
dungers_bitbuf = { path = "vendor/haste/crates/dungers_bitbuf" }
dungers_charsor = { path = "vendor/haste/crates/dungers_charsor" }
dungers_varint = { path = "vendor/haste/crates/dungers_varint" }

prost = "0.14.4"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
bytemuck = "1.25.2"
bytes = "1.12.1"
expect-test = "1.5.1"
hashbrown = { version = "0.17.1", default-features = false }
http = "1.5.0"
log = "0.4.34"
nohash = "0.2.0"
snap = "1.1.2"

[profile.release]
debug = false

[profile.dev.package."*"]
opt-level = 3
