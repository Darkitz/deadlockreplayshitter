[package]
name = "dlparse"
version = "0.1.0"
edition.workspace = true

[dependencies]
haste = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
valveprotos = { workspace = true, features = ["gc-common", "serde"] }
ruzstd = "0.7"

[[bin]]
name = "dlparse"
path = "src/main.rs"

[[bin]]
name = "dlmeta"
path = "src/meta.rs"
