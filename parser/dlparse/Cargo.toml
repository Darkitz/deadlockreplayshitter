[package]
name = "dlparse"
version = "0.1.0"
edition.workspace = true

[dependencies]
haste = { path = "../vendor/haste/crates/haste_core", package = "haste_core" }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
valveprotos = { workspace = true }

[[bin]]
name = "dlparse"
path = "src/main.rs"

[lib]
name = "dlparse"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# browser build: Valve's replay downloads are .dem.bz2 and browsers can't decompress bzip2
[target.'cfg(target_arch = "wasm32")'.dependencies]
bzip2-rs = "0.1"
